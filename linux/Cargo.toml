[package]
name = "panaru"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Client nativo per il file sharing self-hosted con Gokapi"
license = "Apache-2.0"
repository = "https://github.com/piratepxl/panaru"

[dependencies]
# Interfaccia: GTK 4.14 / libadwaita 1.5 come minimo (Ubuntu 24.04 LTS, Debian 13, Fedora 40+).
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
# HTTP bloccante su thread dedicati: niente runtime async, cancellazione via flag.
ureq = { version = "2.12", default-features = false, features = ["tls", "native-certs", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
directories = "6"
async-channel = "2"
mime_guess = "2"
# API key nel portachiavi di sistema (Secret Service: GNOME Keyring, KWallet, KeePassXC…).
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tiny_http = "0.12"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
